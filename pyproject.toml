[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kv-offload-lab"
version = "0.1.0"
authors = [{ name = "lcc-star" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "KV cache offloading, scheduling, and correctness experiments"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "triton>=3.0.0",
    "transformers>=4.51.0",
    "flash-attn",
    "ninja",
    "xxhash",
]

[project.urls]
Homepage="https://github.com/lcc-star/kv-offload-lab"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]
